[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinsec-benchmark"
version = "0.1.0"
description = "Cross-domain trustworthy digital-twin CPS cybersecurity benchmark"
requires-python = ">=3.10"
authors = [{name = "Hira Khyzer"}]
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7"]
